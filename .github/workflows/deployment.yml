name: Deploymennt
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Cache Dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.pnpm
          key: ${{ hashFiles('**pnpm-lock.yaml')}}
      - name: Install Dependencies
        run: pnpm install
      - name: return path
        run: pnpm store path
      - name: Build Project
        run: pnpm build
